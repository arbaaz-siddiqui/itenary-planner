<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nikki — Dubai Trip Planner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 1.4rem; font-weight: 600; color: #f0a500; margin-bottom: 4px; }
  p.sub { color: #888; font-size: 0.85rem; margin-bottom: 32px; }
  #btn { width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer; font-size: 2.5rem; background: #1a1a1a; border: 2px solid #333; transition: all 0.2s; }
  #btn.active { background: #2a1a00; border-color: #f0a500; box-shadow: 0 0 20px #f0a50055; }
  #btn.listening { background: #001a0a; border-color: #00cc66; box-shadow: 0 0 20px #00cc6644; }
  #status { margin-top: 20px; font-size: 0.9rem; color: #888; text-align: center; min-height: 40px; }
  #transcript { margin-top: 16px; width: 340px; background: #1a1a1a; border-radius: 12px; padding: 14px; font-size: 0.82rem; color: #bbb; max-height: 200px; overflow-y: auto; line-height: 1.5; }
  .turn-user { color: #ccc; }
  .turn-user span { color: #888; font-size: 0.75rem; }
  .turn-agent { color: #f0a500; margin-top: 4px; }
  .turn-agent span { color: #a06000; font-size: 0.75rem; }
</style>
</head>
<body>
<h1>Nikki — Gujju Tours</h1>
<p class="sub">Dubai Trip Planner · Hinglish Voice</p>
<button id="btn" onclick="toggleCall()">📞</button>
<div id="status">Click to start call</div>
<div id="transcript"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let ws = null;
let micStream = null;
let audioCtx = null;
let micProcessor = null;
let nextPlayTime = 0;
let active = false;
const WS_URL = "ws://localhost:8765/ws";

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");

// ─── Backchannel phrases (played immediately when agent is thinking) ──────────
// These are short pre-recorded-style strings; we just display them as text
// while the agent processes. The actual audio comes from TTS.
const BACKCHANNELS = ["Hmm...", "Haan...", "Ok...", "Ji...", "Acha..."];
let backchannelTimer = null;

function showBackchannel() {
  const phrase = BACKCHANNELS[Math.floor(Math.random() * BACKCHANNELS.length)];
  setStatus("🎙️ " + phrase, "agent");
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function setStatus(msg, mode) {
  statusEl.textContent = msg;
  btn.className = mode === "listening" ? "listening" : mode === "agent" ? "active" : "";
}

function addTranscript(role, text) {
  const div = document.createElement("div");
  div.className = role === "user" ? "turn-user" : "turn-agent";
  div.innerHTML = `<span>${role === "user" ? "You" : "Nikki"}</span><br>${text}`;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// ─── Protobuf helpers ─────────────────────────────────────────────────────────
function encodeVarint(n) {
  const out = [];
  while (n > 0x7f) { out.push((n & 0x7f) | 0x80); n >>>= 7; }
  out.push(n & 0x7f);
  return new Uint8Array(out);
}

function concat(arrays) {
  const len = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(len);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}

function encodeAudioFrame(pcm16, sampleRate, channels) {
  const pcmBytes = new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
  // Inner AudioRawFrame: field3=audio, field4=sample_rate, field5=num_channels
  const inner = concat([
    new Uint8Array([0x1a]), encodeVarint(pcmBytes.length), pcmBytes,
    new Uint8Array([0x20]), encodeVarint(sampleRate),
    new Uint8Array([0x28]), encodeVarint(channels),
  ]);
  // Outer Frame: field2=audio_raw_frame
  return concat([new Uint8Array([0x12]), encodeVarint(inner.length), inner]);
}

// ─── Incoming audio decode ────────────────────────────────────────────────────
function decodeVarint(buf, offset) {
  let result = 0, shift = 0;
  while (offset < buf.length) {
    const b = buf[offset++];
    result |= (b & 0x7f) << shift;
    if (!(b & 0x80)) break;
    shift += 7;
  }
  return { value: result, offset };
}

function parseAudioRawFrame(buf) {
  let offset = 0, audio = null, sr = 24000, ch = 1;
  while (offset < buf.length) {
    const tag = buf[offset++];
    const fieldNum = tag >> 3, wireType = tag & 0x7;
    if (wireType === 2) {
      const { value: len, offset: o } = decodeVarint(buf, offset);
      offset = o;
      if (fieldNum === 3) audio = buf.slice(offset, offset + len);
      offset += len;
    } else if (wireType === 0) {
      const { value, offset: o } = decodeVarint(buf, offset);
      offset = o;
      if (fieldNum === 4) sr = value;
      if (fieldNum === 5) ch = value;
    } else break;
  }
  return audio ? { audio, sampleRate: sr, channels: ch } : null;
}

function decodeAudioFrame(buf) {
  let offset = 0;
  while (offset < buf.length) {
    const tag = buf[offset++];
    const fieldNum = tag >> 3, wireType = tag & 0x7;
    if (wireType === 2) {
      const { value: len, offset: o } = decodeVarint(buf, offset);
      offset = o;
      if (fieldNum === 2) return parseAudioRawFrame(buf.slice(offset, offset + len));
      offset += len;
    } else break;
  }
  return null;
}

// ─── WAV header stripping ─────────────────────────────────────────────────────
function stripWavHeader(bytes) {
  const isWav = bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46;
  if (!isWav) return { pcm: bytes, sampleRate: 24000 };
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const sr = view.getUint32(24, true);
  return { pcm: bytes.slice(44), sampleRate: sr };
}

// ─── PCM16 playback ───────────────────────────────────────────────────────────
function playPCM16(pcmBytes, sampleRate, channels) {
  if (!audioCtx || audioCtx.state === "closed") return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  const samples = pcmBytes.length / 2;
  const floats = new Float32Array(samples);
  const view = new DataView(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength);
  for (let i = 0; i < samples; i++) floats[i] = view.getInt16(i * 2, true) / 32768;
  const buf = audioCtx.createBuffer(channels, samples, sampleRate);
  buf.copyToChannel(floats, 0);
  if (channels > 1) buf.copyToChannel(floats, 1);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  const when = Math.max(now, nextPlayTime);
  src.start(when);
  nextPlayTime = when + buf.duration;
}

// ─── Mic capture ─────────────────────────────────────────────────────────────
async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 }, video: false });
  const srcNode = audioCtx.createMediaStreamSource(micStream);
  const bufSize = 2048;
  micProcessor = audioCtx.createScriptProcessor(bufSize, 1, 1);
  micProcessor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
    ws.send(encodeAudioFrame(pcm, audioCtx.sampleRate, 1));
  };
  srcNode.connect(micProcessor);
  micProcessor.connect(audioCtx.destination);
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    setStatus("🎙️ Connected — speak now", "listening");
    startMic();
  };

  ws.onmessage = (event) => {
    clearTimeout(backchannelTimer);
    if (typeof event.data === "string") {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === "transcript") {
          addTranscript("user", msg.text);
          // Show backchannel after 600ms if no audio comes back quickly
          backchannelTimer = setTimeout(showBackchannel, 600);
          setStatus("💭 Thinking...", "");
        } else if (msg.type === "llm_start") {
          backchannelTimer = setTimeout(showBackchannel, 600);
          setStatus("💭 Thinking...", "");
        }
      } catch {}
      return;
    }
    const frame = decodeAudioFrame(new Uint8Array(event.data));
    if (!frame) return;
    const { pcm, sampleRate } = stripWavHeader(frame.audio);
    if (pcm.length < 2) return;
    playPCM16(pcm, sampleRate, frame.channels);
    setStatus("🔊 Nikki is speaking...", "agent");
  };

  ws.onclose = () => {
    setStatus("Call ended", "");
    btn.textContent = "📞";
    btn.className = "";
    active = false;
    stopMic();
  };

  ws.onerror = () => {
    setStatus("❌ Connection failed — is the server running?", "");
    active = false;
  };
}

function stopMic() {
  if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

// ─── Main toggle ──────────────────────────────────────────────────────────────
async function toggleCall() {
  if (!active) {
    // AudioContext MUST be created inside user gesture (Chrome autoplay policy)
    audioCtx = new AudioContext({ sampleRate: 24000 });
    nextPlayTime = 0;
    active = true;
    btn.textContent = "⏹️";
    setStatus("🔌 Connecting...", "");
    connectWS();
  } else {
    active = false;
    if (ws) { ws.close(); ws = null; }
    stopMic();
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    clearTimeout(backchannelTimer);
    setStatus("Click to start call", "");
    btn.textContent = "📞";
    btn.className = "";
  }
}
</script>
</body>
</html>
