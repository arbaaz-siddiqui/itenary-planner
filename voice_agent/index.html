<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nikki — Dubai Trip Planner (Pipecat POC)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2d3050;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #f6a623);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .subtitle { color: #8b8fa8; font-size: 0.9rem; margin-bottom: 32px; }

    .status {
      background: #0f1117;
      border: 1px solid #2d3050;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #8b8fa8;
      margin-bottom: 24px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.green  { background: #22c55e; }
    .dot.red    { background: #ef4444; }
    .dot.yellow { background: #eab308; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #startBtn { background: linear-gradient(135deg, #6c63ff, #9b5cf6); color: #fff; }
    #stopBtn  { background: #ef4444; color: #fff; display: none; margin-top: 12px; }

    .note { color: #555; font-size: 0.75rem; margin-top: 20px; }

    /* Waveform visualizer */
    #waveform {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-bottom: 20px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #waveform.active { opacity: 1; }
    .bar {
      width: 4px;
      background: #6c63ff;
      border-radius: 2px;
      transition: height 0.1s;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar">🧳</div>
  <h1>Nikki</h1>
  <p class="subtitle">AI Travel Consultant — Gujju Tours</p>

  <div class="status" id="statusBox">
    <span class="dot" id="dot"></span>
    <span id="statusText">Ready to connect</span>
  </div>

  <div id="waveform">
    <!-- bars injected by JS -->
  </div>

  <button id="startBtn" onclick="startCall()">🎙️ Start Call with Nikki</button>
  <button id="stopBtn"  onclick="stopCall()">⏹ End Call</button>

  <p class="note">Uses your microphone. Speak naturally in Hindi or English.</p>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
// ─── Protobuf-lite frame codec (matches pipecat ProtobufFrameSerializer) ─────
// Pipecat sends/receives binary protobuf frames. For a POC we use a simplified
// hand-written codec that matches the wire format.
//
// Frame proto (simplified):
//   message Frame {
//     oneof frame { AudioRawFrame audio_raw = 8; ... }
//   }
//   message AudioRawFrame { bytes audio = 1; uint32 sample_rate = 2; uint32 num_channels = 3; }
//
// We only need AudioRawFrame: tag=8 (field 8, type 2=LEN), then the inner message.
// Inner: tag=1 bytes, tag=2 varint, tag=3 varint.

function encodeVarint(val) {
  const buf = [];
  while (val > 0x7f) { buf.push((val & 0x7f) | 0x80); val >>>= 7; }
  buf.push(val);
  return new Uint8Array(buf);
}

function encodeAudioFrame(pcm16, sampleRate, channels) {
  // Build inner AudioRawFrame
  const audioTag = new Uint8Array([0x0a]); // field 1, type 2 (LEN)
  const audioLen = encodeVarint(pcm16.byteLength);
  const srTag    = new Uint8Array([0x10]); // field 2, type 0 (VARINT)
  const srVal    = encodeVarint(sampleRate);
  const chTag    = new Uint8Array([0x18]); // field 3, type 0 (VARINT)
  const chVal    = encodeVarint(channels);

  const inner = concat([audioTag, audioLen, new Uint8Array(pcm16.buffer), srTag, srVal, chTag, chVal]);
  // Wrap in outer Frame with field 8 (AudioRawFrame), type 2 (LEN)
  const outerTag = new Uint8Array([0x42]); // (8 << 3) | 2 = 66 = 0x42
  const outerLen = encodeVarint(inner.length);
  return concat([outerTag, outerLen, inner]);
}

function concat(arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}

// ─── State ──────────────────────────────────────────────────────────────────
let ws = null;
let audioCtx = null;
let scriptNode = null;
let mediaStream = null;
let waveformAnimId = null;

// Build waveform bars
const waveformEl = document.getElementById('waveform');
const BARS = 20;
for (let i = 0; i < BARS; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = '4px';
  waveformEl.appendChild(bar);
}

function setStatus(text, color) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('dot');
  dot.className = 'dot ' + (color || '');
}

function animateWaveform(active) {
  const bars = waveformEl.querySelectorAll('.bar');
  waveformEl.classList.toggle('active', active);
  if (waveformAnimId) { clearInterval(waveformAnimId); waveformAnimId = null; }
  if (!active) { bars.forEach(b => b.style.height = '4px'); return; }
  waveformAnimId = setInterval(() => {
    bars.forEach(b => {
      const h = 4 + Math.random() * 30;
      b.style.height = h + 'px';
    });
  }, 120);
}

async function startCall() {
  document.getElementById('startBtn').disabled = true;
  setStatus('Requesting microphone…', 'yellow');

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('Microphone access denied.', 'red');
    document.getElementById('startBtn').disabled = false;
    return;
  }

  const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
  setStatus('Connecting…', 'yellow');
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('Connected — speak now!', 'green');
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
    startStreaming();
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      playAudio(evt.data);
    }
  };

  ws.onerror = (e) => { setStatus('WebSocket error.', 'red'); };
  ws.onclose = () => {
    setStatus('Call ended.', '');
    cleanup();
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').style.display = 'none';
  };
}

function startStreaming() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const source = audioCtx.createMediaStreamSource(mediaStream);
  scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

  scriptNode.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const float32 = e.inputBuffer.getChannelData(0);
    // Convert float32 [-1,1] → int16
    const pcm16 = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      pcm16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
    }
    const frame = encodeAudioFrame(pcm16, 16000, 1);
    ws.send(frame);
  };

  source.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);
  animateWaveform(true);
}

// Simple audio playback queue for TTS output
const audioQueue = [];
let isPlaying = false;
let playbackCtx = null;

function playAudio(arrayBuffer) {
  audioQueue.push(arrayBuffer);
  if (!isPlaying) drainQueue();
}

async function drainQueue() {
  if (!audioQueue.length) { isPlaying = false; return; }
  isPlaying = true;
  const buf = audioQueue.shift();
  if (!playbackCtx) {
    playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  try {
    const decoded = await playbackCtx.decodeAudioData(buf.slice(0));
    const src = playbackCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(playbackCtx.destination);
    src.onended = drainQueue;
    src.start();
  } catch (e) {
    drainQueue();
  }
}

function stopCall() {
  if (ws) ws.close();
}

function cleanup() {
  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  animateWaveform(false);
}
</script>
</body>
</html>
